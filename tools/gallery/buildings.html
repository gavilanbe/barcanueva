<!doctype html><meta charset="utf-8"><title>Edificios y muebles</title>
<style>body{margin:0;background:#222}canvas{image-rendering:pixelated}</style>
<canvas id="g"></canvas>
<script type="module">
// Galería de edificios y muebles. Secciones por hash: #city #civic #big #rural #night #doors #furn #all
// (tools/gal.mjs añade «.html» al nombre: «buildings.html#night» → hash «#night.html», se limpia abajo)
import { drawBuilding, drawBuildingLights, drawDoorOpen, ICONS } from '../../js/buildings.js';
import { drawFurniture, ANIMATED_FURNITURE } from '../../js/furniture.js';
const sec = (location.hash.replace('#', '').replace('.html', '') || 'city');
const B = (id, kind, x, y, w, h, extra = {}) => ({ id, kind, x, y, w, h, door: extra.door || { x: x + Math.floor(w / 2), y: y + h - 1 }, ...extra });
const city = [
  B('c_raval1', 'casa', 3, 10, 4, 3), B('c_raval2', 'casa', 8, 10, 4, 3), B('c_ribera1', 'casa', 47, 11, 4, 3), B('c_ribera2', 'casa', 52, 11, 4, 3),
  B('c_seu1', 'casa', 39, 3, 4, 3), B('c_seu2', 'casa', 43, 3, 4, 3), B('c_centro1', 'casa', 27, 25, 4, 3), B('c_centro3', 'casa', 37, 25, 4, 3, { forSale: 800 }),
  B('c_call1', 'casa', 17, 12, 4, 3), B('c_port1', 'casa', 12, 30, 4, 3),
  B('tab_oca', 'taberna', 40, 11, 5, 4), B('tab_drac', 'taberna', 24, 30, 5, 4), B('tab_gats', 'taberna', 16, 4, 4, 4), B('tab_ramb', 'taberna', 8, 24, 4, 4, { door: { x: 9, y: 27 } }),
  B('t_hierbas', 'tienda', 16, 17, 4, 4, { icon: ICONS.hierbas, awning: '#3a9a5a' }), B('t_forja', 'tienda', 27, 17, 4, 4, { icon: ICONS.forja, awning: '#5a5a6a' }),
  B('t_sastre', 'tienda', 32, 17, 4, 4, { icon: ICONS.sastre, awning: '#c84a6a' }), B('t_libros', 'tienda', 37, 17, 4, 4, { icon: ICONS.libros, awning: '#3a5a8a' }),
  B('t_alquimia', 'tienda', 42, 17, 4, 4, { icon: ICONS.alquimia, awning: '#6a3a9a' }), B('t_pan', 'tienda', 17, 25, 4, 4, { icon: ICONS.pan, awning: '#e8a030' }),
  B('t_velas', 'tienda', 22, 25, 4, 4, { icon: ICONS.vela, awning: '#c8a030' }), B('t_pesca', 'tienda', 18, 30, 4, 4, { icon: ICONS.pescado, awning: '#3a7ac8' }),
  B('t_ceramica', 'tienda', 47, 17, 4, 4, { icon: ICONS.ceramica, awning: '#c86a44' }),
];
const civic = [
  B('cuartel', 'cuartel', 23, 3, 4, 4, { wall: '#c8b898' }), B('consell', 'casa', 22, 10, 5, 5, { wall: '#d8c8a0', roof: '#8a4a3a' }),
  B('hosp_cruz', 'hospital', 3, 4, 8, 5, { door: { x: 6, y: 8 } }), B('hosp_pau', 'hospital', 49, 3, 8, 5, { door: { x: 52, y: 7 } }),
  B('llotja', 'casa', 31, 29, 7, 5, { wall: '#e0d0b0', roof: '#7a6a5a' }), B('drassanes', 'casa', 3, 29, 9, 5, { wall: '#c8a878', roof: '#8a5a3a' }),
];
const big = [
  B('seu', 'catedral', 27, 3, 10, 7, { variant: 'seu', door: { x: 31, y: 9 } }), B('mar', 'catedral', 42, 24, 10, 7, { variant: 'mar', door: { x: 46, y: 30 } }),
  B('castillo', 'castillo', 12, 1, 16, 8, { door: { x: 20, y: 8 } }),
];
const rural = [
  B('masia_ferrer', 'masia', 15, 5, 6, 4), B('masia_prat', 'masia', 28, 14, 6, 4), B('molino', 'casa', 8, 13, 4, 3), B('molino_rio', 'casa', 3, 10, 4, 3),
  B('ermita', 'casa', 36, 13, 4, 3, { wall: '#d8d0c0', roof: '#7a6a5a' }),
  B('cabana_bruja', 'cabana', 8, 6, 4, 3), B('cabana_guarda', 'cabana', 37, 5, 4, 3), B('cabana_pescador', 'cabana', 40, 12, 4, 3), B('barraca1', 'cabana', 18, 25, 4, 3), B('barraca2', 'cabana', 24, 25, 4, 3),
  B('templo_montana', 'templo', 20, 2, 7, 4, { noEnter: true }), B('templo_mar', 'templo', 18, 8, 7, 4, { noEnter: true }),
  B('altar_pradera', 'altar', 42, 6, 1, 1, { noEnter: true }), B('altar_bosque', 'altar', 38, 25, 1, 1, { noEnter: true }), B('altar_rio', 'altar', 24, 30, 1, 1, { noEnter: true }),
  B('puesto0', 'puesto', 4, 14, 2, 2, { noEnter: true }), B('puesto1', 'puesto', 7, 14, 2, 2, { noEnter: true }), B('puesto2', 'puesto', 10, 14, 2, 2, { noEnter: true }),
  B('barca0', 'barca', 22, 39, 3, 3, { noEnter: true }), B('barca1', 'barca', 32, 39, 3, 3, { noEnter: true }), B('tienda_c', 'tienda_campana', 5, 5, 3, 3, { noEnter: true }),
];
const ground = { city: '#8c8278', civic: '#8c8278', big: '#6f9a4e', rural: '#6f9a4e', night: '#8c8278', doors: '#8c8278' };
const g = document.getElementById('g'); const gx = g.getContext('2d'); gx.imageSmoothingEnabled = false;
function layout(list, maxW) { // coloca los edificios en filas dejando sitio arriba (24 px) para torres y chimeneas
  let x = 8, y = 30, rowH = 0; const out = [];
  for (const b of list) { const w = b.w * 16, h = b.h * 16; if (x + w + 8 > maxW) { x = 8; y += rowH + 36; rowH = 0; } out.push([b, x, y]); x += w + 14; rowH = Math.max(rowH, h); }
  return { out, H: y + rowH + 10 };
}
function sheet(list, maxW, scale, night = false, bg = '#8c8278', water = false) {
  const { out, H } = layout(list, maxW);
  const c = document.createElement('canvas'); c.width = maxW; c.height = H; const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.fillStyle = bg; x.fillRect(0, 0, maxW, H);
  for (let j = 0; j < H; j += 16) for (let i = 0; i < maxW; i += 16) if (((i + j) >> 4) % 2) { x.fillStyle = 'rgba(0,0,0,.05)'; x.fillRect(i, j, 16, 16); }
  for (const [b, px, py] of out) {
    if (b.kind === 'barca') { x.fillStyle = '#2a5a9a'; x.fillRect(px - 6, py - 4, b.w * 16 + 12, b.h * 16 + 8); x.fillStyle = '#3a78b8'; for (let k = 0; k < 6; k++) x.fillRect(px - 4 + k * 9, py + (k % 3) * 14, 5, 1); }
    x.fillStyle = 'rgba(255,255,255,.18)'; x.fillRect(px, py + b.h * 16, b.w * 16, 1); // marca de la planta
    drawBuilding(x, b, b.x * 16 - px, b.y * 16 - py);
  }
  if (night) {
    x.globalCompositeOperation = 'multiply'; x.fillStyle = '#2a3070'; x.globalAlpha = 0.85; x.fillRect(0, 0, maxW, H); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
    for (const [b, px, py] of out) drawBuildingLights(x, b, b.x * 16 - px, b.y * 16 - py, 0);
  }
  return blow(c, scale);
}
function blow(c, s) { g.width = c.width * s; g.height = c.height * s; gx.imageSmoothingEnabled = false; gx.drawImage(c, 0, 0, c.width * s, c.height * s); }
function doors() {
  const list = [city[0], city[10], city[14], civic[0], civic[2], big[0], big[2], rural[0], rural[5], rural[8]];
  const c = document.createElement('canvas'); c.width = 560; c.height = list.length * 46 + 10; const x = c.getContext('2d'); x.fillStyle = '#8c8278'; x.fillRect(0, 0, c.width, c.height);
  list.forEach((b, i) => {
    drawBuilding(document.createElement('canvas').getContext('2d'), b, 0, 0); // registra doorRect
    const d = b.doorRect; if (!d) return;
    for (let k = 0; k < 5; k++) {
      const t = k / 4, ox = d.x - (10 + k * 110) - 20, oy = d.y - (10 + i * 46) - 8;
      x.save(); x.beginPath(); x.rect(10 + k * 110, 10 + i * 46, 100, 40); x.clip();
      drawBuilding(x, b, ox, oy); if (k) drawDoorOpen(x, b, ox, oy, t); x.restore();
    }
  });
  blow(c, 2);
}
function furn() {
  const types = [['cama', 1, 2], ['mesa', 2, 1], ['mesa', 3, 1], ['mesa', 2, 2], ['mesa', 6, 2], ['silla', 1, 1], ['chimenea', 2, 2], ['caldero', 1, 1], ['caldero', 2, 2], ['estante', 7, 1, 't_libros'], ['estante', 7, 1, 't_alquimia'], ['estante', 7, 1, 't_hierbas'],
    ['estante', 7, 1, 't_sastre'], ['estante', 7, 1, 't_pan'], ['estante', 7, 1, 't_velas'], ['estante', 7, 1, 't_ceramica'], ['estante', 7, 1, 't_pesca'], ['estante', 7, 1, 't_forja'], ['estante', 2, 1], ['estante', 1, 3, 't_libros'],
    ['mostrador', 5, 1], ['barra', 5, 1], ['barriles', 2, 1], ['altar', 3, 1], ['cruz', 1, 1, null, true], ['cruz', 1, 1], ['banco', 5, 1], ['banco', 4, 1], ['vela', 1, 1], ['pila', 1, 1], ['claustro', 1, 1], ['trono', 1, 1], ['trono2', 1, 1],
    ['tapiz', 2, 2], ['columna', 1, 1], ['armero', 3, 1], ['yunque', 1, 1], ['fragua', 2, 1], ['arcon', 1, 1], ['casco', 7, 3], ['madera', 2, 2], ['huesos', 1, 1]];
  const W = 520; const c = document.createElement('canvas'); c.width = W; c.height = 1000; const x = c.getContext('2d');
  // suelo de tarima y franja de pared
  let cx = 8, cy = 16, rowH = 0, maxY = 0; const placed = [];
  for (const [type, w, h, goods, severe] of types) {
    const pw = w * 16, ph = h * 16; if (cx + pw + 8 > W) { cx = 8; cy += rowH + 22; rowH = 0; }
    placed.push({ type, w, h, goods, severe, X: cx, Y: cy }); cx += pw + 10; rowH = Math.max(rowH, ph); maxY = cy + rowH;
  }
  c.height = maxY + 120;
  x.fillStyle = '#9a6a42'; x.fillRect(0, 0, W, c.height); for (let j = 0; j < c.height; j += 4) { x.fillStyle = j % 8 ? '#8e6038' : '#a87448'; x.fillRect(0, j, W, 1); }
  for (const p of placed) { x.fillStyle = '#6a5442'; x.fillRect(p.X - 2, p.Y - 14, p.w * 16 + 4, 14); x.fillStyle = '#7e6650'; x.fillRect(p.X - 2, p.Y - 14, p.w * 16 + 4, 2); }
  for (const p of placed) drawFurniture(x, { type: p.type, x: p.X >> 4, y: p.Y >> 4, w: p.w, h: p.h, goods: p.goods, severe: p.severe }, p.X, p.Y, 0);
  // fotogramas de las piezas animadas
  let ax = 8; const ay = maxY + 30;
  for (const t of ['chimenea', 'caldero', 'vela', 'altar', 'fragua', 'pila', 'claustro']) {
    const [w, h] = t === 'chimenea' ? [2, 2] : t === 'altar' ? [3, 1] : t === 'fragua' ? [2, 1] : [1, 1];
    for (let f = 0; f < 6; f += 2) { if (ax + w * 16 > W) break; drawFurniture(x, { type: t, x: 0, y: 0, w, h }, ax, ay + (h === 2 ? 0 : 16), f * 7); ax += w * 16 + 4; }
    ax += 6;
  }
  blow(c, 3);
}
if (sec === 'city') sheet(city, 560, 2);
else if (sec === 'civic') sheet(civic, 600, 2);
else if (sec === 'big') sheet(big, 600, 2, false, '#6f9a4e');
else if (sec === 'rural') sheet(rural, 640, 2, false, '#6f9a4e');
else if (sec === 'night') sheet([...city.slice(0, 4), city[10], city[12], city[14], civic[0], civic[2], big[0], big[1], rural[5], rural[8], rural[13], rural[18]], 700, 2, true);
else if (sec === 'nightbig') sheet([big[0], big[1], big[2], civic[1], civic[5]], 600, 2, true);
else if (sec === 'doors') doors();
else if (sec === 'zoom') sheet([city[0], city[1], city[10], city[14]], 330, 4);
else if (sec === 'small') sheet([rural[12], rural[13], rural[14], rural[15], rural[16], city[14], city[17], rural[18]], 300, 4, false, '#6f9a4e');
else if (sec === 'cath') sheet([big[0], big[1]], 380, 3, false, '#6f9a4e');
else if (sec === 'zoom2') sheet([civic[0], city[11], city[13], rural[1]], 330, 4, false, '#6f9a4e');
else if (sec === 'furn') furn();
</script>
